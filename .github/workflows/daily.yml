name: Zambia Infrastructure Opportunity Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run daily monitor
        run: python main.py

      - name: Prepare GitHub Pages site
        run: |
          mkdir -p public
          latest_report=$(ls -t reports/*.html | head -n 1)
          cp "$latest_report" public/latest.html
          cp "$latest_report" public/index.html

      - name: Upload reports as artifact backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zambia-infrastructure-reports
          path: reports/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
