name: Zambia Infrastructure Opportunity Intelligence

on:
  schedule:
    # Africa/Lusaka is UTC+02:00. 09:00 Africa/Lusaka = 07:00 UTC.
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run daily monitor
        run: python main.py

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zambia-infrastructure-reports
          path: reports/
